<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>register form</title>
        </head>
        <body>
          <h1>Registration Form</h1>
            <br />
            <div class="main-div">
                <form>
                    <label for="name">Name</label>
                        <input type="text" name="name" id="name" placeholder="Enter your name" required>
                            
                                <br /><br />
                                    
                                        <label for="fatherName">Father Name</label>
                                            <input type="text" name="fatherName" id="fatherName" placeholder="Father name" required/>
                                                
                                                    <br /><br />
                                                        
                                                            <label for="email">Email</label>
                                                                <input type="email" name="email" id="email" placeholder="Enter your email" required>
                                                                    
                                                                        <br /><br />
                                                                            
                                                                                <label for="password">Password</label>
                                                                                    <input type="password" name="password" id="password" placeholder="Enter your password" required/>
                                                                                        
                                                                                            <br /><br />
                                                                                                
                                                                                                    <label for="phone">Phone</label>
                                                                                                        <input type="number" name="number" id="number" placeholder="Enter your phone number" required>
                                                                                                            
                                                                                                                <br /><br />
                                                                                                                    
                                                                                                                        <label for="cnic">CNIC</label>
                                                                                                                            <input type="text" name="cnic" id="cnic" value="" placeholder="12345-1234567-1" maxlength="15" required/>
                                                                                                                                
                                                                                                                                    <br /><br />
                                                                                                                                        
                                                                                                                                            <label for="birth">Date of birth</label>
                                                                                                                                                <input type="date" name="birth" id="birth" required>
                                                                                                                                                    
                                                                                                                                                        <br /><br />
                                                                                                                                                            
                                                                                                                                                                <label for="gender">Gender:</label>
                                                                                                                                                                    
                                                                                                                                                                        <label for="male">Male</label>
                                                                                                                                                                            <input type="radio" name="gender" id="male" value="male">
                                                                                                                                                                                
                                                                                                                                                                                    <label for="female">Female</label>
                                                                                                                                                                                        <input type="radio" name="gender" id="female" value="female">
                                                                                                                                                                                            
                                                                                                                                                                                                <br /><br />
                                                                                                                                                                                                    
                                                                                                                                                                                                        <label for="skils">Skils:</label>
                                                                                                                                                                                                            <label for="HTML">HTML</label>
                                                                                                                                                                                                                <input type="checkbox" name="skills" id="HTML">
                                                                                                                                                                                                                    <label for="CSS">CSS</label>
                                                                                                                                                                                                                        <input type="checkbox" name="skills" id="CSS">
                                                                                                                                                                                                                            <label for="javascrip">Javascrip</label>
                                                                                                                                                                                                                                <input type="checkbox" name="skills" id="javascript">
                                                                                                                                                                                                                                    <label for="react">React</label>
                                                                                                                                                                                                                                        <input type="checkbox" name="skills" id="react">
                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                <br /><br />
                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                        <label for="education">Education</label>
                                                                                                                                                                                                                                                            <select name="education" id="education">
                                                                                                                                                                                                                                                                  <option value="matric">matric</option>
                                                                                                                                                                                                                                                                        <option value="intermediat">intermediat</option>
                                                                                                                                                                                                                                                                              <option value="becholor">becholor</option>
                                                                                                                                                                                                                                                                                    <option value="master">master</option>
                                                                                                                                                                                                                                                                                        </select>
                                                                                                                                                                                                                                                                                              <br /><br />
                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                          <label for="city">City</label>
                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                      <select name="city" id="city">
                                                                                                                                                                                                                                                                                                                              <option value="karachi">karachi</option>
                                                                                                                                                                                                                                                                                                                                      <option value="lahore">lahore</option>
                                                                                                                                                                                                                                                                                                                                              <option value="islamabad">islamabad</option>
                                                                                                                                                                                                                                                                                                                                                      <option value="quetta">quetta</option>
                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                        <br /><br />
                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                    <label for="upload">Upload your image</label>
                                                                                                                                                                                                                                                                                                                                                                                        <input type="file" name="upload" id="upload">
                                                                                                                                                                                                                                                                                                                                                                                            <br /><br />
                                                                                                                                                                                                                                                                                                                                                                                                <label for="upload2">upload your CV</label>
                                                                                                                                                                                                                                                                                                                                                                                                    <input type="file" name="upload2" id=upload2"">
                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                            <br /><br />
                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="address">address</label><br />
                                                                                                                                                                                                                                                                                                                                                                                                                        <textarea name="" id= rows="8" cols="40" placeholder="enter your address..." required></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                            <br /><br />
                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="checkbox" name="terms" id="terms">
                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="terms">I agree to the terms and conditions</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <br /><br />
                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit">Submit</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="reset">Reset</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
